<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2933"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Terminal fills most space -->
  <rect x="8" y="14" width="48" height="36" rx="6"
        fill="none" stroke="#ffffff" stroke-width="2.8"/>

  <!-- Prompt (bigger for visibility) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 30 L28 35 L20 40"/>   <!-- > -->
    <line x1="32" y1="40" x2="42" y2="40"/> <!-- _ -->
  </g>

  <!-- Top LEDs (compact and aligned) -->
  <circle cx="42" cy="20" r="2" fill="#ef4444"/>
  <circle cx="47" cy="20" r="2" fill="#facc15"/>
  <circle cx="52" cy="20" r="2" fill="#22c55e"/>

</svg>
