<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serial Console</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/xterm/xterm.css?v=__BUILD__" />
  <link rel="stylesheet" href="/style.css?v=__BUILD__" />
</head>
<body>
  <div class="shell">

    <header class="header">
      <div class="brand">
        <a href="https://www.orbit-os.org/" target="_blank" rel="noopener" title="Orbit OS website"><img src="/orbit-logo.svg?v=__BUILD__" alt="Orbit OS" width="143" height="48" /></a>
        <h1>Serial Console</h1>
      </div>
      <div id="state" class="state" role="status" aria-live="polite">
        <span class="dot"></span><span id="stateText">Disconnected</span>
      </div>
    </header>

    <section class="settings" aria-label="Connection settings">
      <div class="field field-port">
        <label for="portSelect">Port</label>
        <div class="row">
          <select id="portSelect"></select>
          <button type="button" id="btnPorts" class="icon" title="Refresh the list of ports" aria-label="Refresh the list of ports">&#8635;</button>
        </div>
        <input type="text" id="portCustom" class="hidden" placeholder="Port name, e.g. ttyUSB0" autocomplete="off" aria-label="Port name" />
      </div>

      <div class="field field-baud">
        <label for="baudSelect">Baud rate</label>
        <select id="baudSelect"></select>
        <input type="text" id="baudCustom" class="hidden" inputmode="numeric" placeholder="Baud rate" autocomplete="off" aria-label="Custom baud rate" />
      </div>

      <div class="field">
        <span class="label">Data · Parity · Stop</span>
        <div class="row">
          <select id="databits" class="frame" aria-label="Data bits">
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
          </select>
          <select id="parity" class="frame" aria-label="Parity">
            <option value="N" selected>N</option>
            <option value="E">E</option>
            <option value="O">O</option>
          </select>
          <select id="stop" class="frame" aria-label="Stop bits">
            <option value="1" selected>1</option>
            <option value="2">2</option>
          </select>
        </div>
      </div>

      <div class="field field-connect">
        <span class="label">&nbsp;</span>
        <button type="button" id="btnConnect" class="primary">Connect</button>
      </div>

      <details class="advanced">
        <summary>Advanced</summary>
        <div class="field">
          <label for="chunk" title="Largest block of received bytes delivered at once">Receive block (bytes)</label>
          <input type="number" id="chunk" value="4096" min="256" step="256" />
        </div>
      </details>

      <p id="note" class="note"></p>
    </section>

    <section class="console" aria-label="Terminal">
      <div id="term" class="screen"></div>

      <div class="toolbar" role="toolbar" aria-label="Terminal options">
        <label title="What the Enter key sends">Enter sends
          <select id="enterMode">
            <option value="cr" selected>CR</option>
            <option value="lf">LF</option>
            <option value="crlf">CR+LF</option>
          </select>
        </label>
        <label title="How bytes are turned into text, in both directions">Text as
          <select id="encoding">
            <option value="utf8" selected>UTF-8</option>
            <option value="latin1">Latin-1 (raw bytes)</option>
          </select>
        </label>
        <label title="Show what you type; turn it on when the equipment does not echo">
          <input type="checkbox" id="localEcho" /> Local echo
        </label>
        <span class="spacer"></span>
        <span class="counters" id="counters" title="Bytes received and sent in this session">RX 0 · TX 0</span>
        <span class="counters" id="size" title="Columns × rows of the terminal"></span>
        <button type="button" id="btnSize" title="A serial line does not carry the window size. This types “stty cols … rows …” into the shell, so that full-screen programs use the whole terminal." disabled>Send size</button>
        <button type="button" id="btnClear" title="Empty the terminal">Clear</button>
        <button type="button" id="btnSave" title="Save the terminal text to a file">Save log</button>
      </div>
    </section>

    <footer class="footer">
      Serial Console v__VERSION__ · Licensed under Apache-2.0 <span class="dot">·</span> <span class="rights">© 2026 Orbit OS</span>
    </footer>

  </div>

  <script src="/xterm/xterm.js?v=__BUILD__"></script>
  <script src="/xterm/addon-fit.js?v=__BUILD__"></script>
  <script src="/xterm/addon-webgl.js?v=__BUILD__"></script>
  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);
    const portSelect = $('portSelect'), portCustom = $('portCustom'), btnPorts = $('btnPorts');
    const baudSelect = $('baudSelect'), baudCustom = $('baudCustom');
    const databits = $('databits'), parity = $('parity'), stop = $('stop'), chunk = $('chunk');
    const btnConnect = $('btnConnect'), note = $('note');
    const stateEl = $('state'), stateText = $('stateText');
    const settingsEl = document.querySelector('.settings');
    const screenEl = $('term');
    const enterMode = $('enterMode'), encoding = $('encoding'), localEcho = $('localEcho');
    const counters = $('counters'), sizeEl = $('size');
    const btnSize = $('btnSize'), btnClear = $('btnClear'), btnSave = $('btnSave');

    const OTHER = '__other__';
    const BAUDS = [300, 1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600, 1000000, 1500000, 2000000, 3000000, 4000000];
    const DEFAULT_BAUD = 9600;
    const SCROLLBACK_LINES = 10000;
    const SETTINGS_KEY = 'serial-console.settings';
    const TOKEN = '__TOKEN__';                    // proves to the app that a request comes from this page
    const wsURL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws?t=' + TOKEN;

    let link = null;                              // the open console: a WebSocket, or HTTP requests
    let httpOnly = false;                         // a WebSocket cannot reach the app from here

    // ---------------------------------------------------------------- settings

    function loadSettings() {
      try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (e) { return {}; }
    }

    function saveSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          port: currentPort(), baud: currentBaud(), databits: databits.value, parity: parity.value,
          stop: stop.value, chunk: chunk.value, enter: enterMode.value, encoding: encoding.value,
          echo: localEcho.checked
        }));
      } catch (e) { /* storage not available: settings are simply not remembered */ }
    }

    const saved = loadSettings();

    function currentPort() {
      return portSelect.value === OTHER ? portCustom.value.trim() : portSelect.value;
    }

    function currentBaud() {
      const raw = baudSelect.value === OTHER ? baudCustom.value : baudSelect.value;
      const n = parseInt(raw, 10);
      return n > 0 ? n : 0;
    }

    function fillBauds() {
      baudSelect.textContent = '';
      for (const b of BAUDS) baudSelect.add(new Option(String(b), String(b)));
      baudSelect.add(new Option('Custom…', OTHER));
      const want = parseInt(saved.baud, 10) || DEFAULT_BAUD;
      if (BAUDS.includes(want)) {
        baudSelect.value = String(want);
      } else {
        baudSelect.value = OTHER;
        baudCustom.value = String(want);
      }
      baudCustom.classList.toggle('hidden', baudSelect.value !== OTHER);
    }

    function fillPorts(ports, preferred) {
      portSelect.textContent = '';
      for (const p of ports) portSelect.add(new Option(p, p));
      portSelect.add(new Option('Other…', OTHER));
      if (preferred && ports.includes(preferred)) {
        portSelect.value = preferred;
      } else if (preferred) {                       // a name typed before, or a port that is no longer listed
        portSelect.value = OTHER;
        portCustom.value = preferred;
      } else {
        portSelect.value = ports.length ? ports[0] : OTHER;
      }
      portCustom.classList.toggle('hidden', portSelect.value !== OTHER);
    }

    function setNote(text, isError) {
      note.textContent = text || '';
      note.classList.toggle('error', !!isError);
    }

    async function refreshPorts() {
      const keep = currentPort() || saved.port || '';
      btnPorts.disabled = true;
      setNote('Reading the ports of the device…');
      try {
        const r = await fetch('/api/ports', { cache: 'no-store' });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        const list = Array.isArray(j.ports) ? [...new Set(j.ports.filter(Boolean))] : [];
        fillPorts(list, keep);
        setNote(list.length ? list.length + ' port' + (list.length === 1 ? '' : 's') + ' found on the device.'
                            : 'The device reports no serial port. Plug in the adapter and refresh, or type the port name.');
      } catch (e) {
        fillPorts([], keep);
        setNote('Could not read the ports: ' + (e.message || e), true);
      } finally {
        btnPorts.disabled = !!link;
      }
    }

    portSelect.addEventListener('change', () => {
      portCustom.classList.toggle('hidden', portSelect.value !== OTHER);
      if (portSelect.value === OTHER) portCustom.focus();
    });
    baudSelect.addEventListener('change', () => {
      baudCustom.classList.toggle('hidden', baudSelect.value !== OTHER);
      if (baudSelect.value === OTHER) baudCustom.focus();
    });
    btnPorts.addEventListener('click', refreshPorts);

    // ---------------------------------------------------------------- terminal

    // xterm.js is a full terminal emulator: colours, cursor movement and
    // full-screen programs work, and it keeps its own scrollback.
    const term = new Terminal({
      cursorBlink: true,
      scrollback: SCROLLBACK_LINES,
      lineHeight: 1.1,                                      // room for underscores when the page draws the text itself
      disableStdin: true,                                   // until a port is open
      fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace',
      fontSize: window.matchMedia('(max-width: 640px)').matches ? 12 : 14,
      theme: {
        background: '#05050a', foreground: '#e6e6f0', cursor: '#8f7bea', cursorAccent: '#05050a',
        selectionBackground: 'rgba(105, 76, 219, 0.45)',
        black: '#1b1b29', red: '#f87171', green: '#34d399', yellow: '#fbbf24',
        blue: '#7aa2f7', magenta: '#b794f6', cyan: '#22d3ee', white: '#d6d6e3',
        brightBlack: '#6b6b88', brightRed: '#fca5a5', brightGreen: '#6ee7b7', brightYellow: '#fde68a',
        brightBlue: '#a5c0ff', brightMagenta: '#d6bcfa', brightCyan: '#67e8f9', brightWhite: '#ffffff'
      }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(screenEl);

    // Draw with the graphics card when the browser allows it. This renderer
    // draws lines, boxes and block characters itself, cell by cell, so logos
    // and frames made of characters line up whatever the font. Without it the
    // terminal still works, drawn as ordinary page text.
    try {
      const gpu = new WebglAddon.WebglAddon();
      gpu.onContextLoss(() => gpu.dispose());
      term.loadAddon(gpu);
    } catch (e) { /* no WebGL here */ }

    function fit() {
      try { fitAddon.fit(); } catch (e) { /* not visible yet */ }
      sizeEl.textContent = term.cols + '×' + term.rows;
    }
    term.onResize(() => { sizeEl.textContent = term.cols + '×' + term.rows; });
    new ResizeObserver(fit).observe(screenEl);
    fit();

    let rxBytes = 0, txBytes = 0;
    let latin1 = null;
    let countersDirty = false;

    function showCounters() {
      if (countersDirty) return;
      countersDirty = true;
      requestAnimationFrame(() => {
        countersDirty = false;
        counters.textContent = 'RX ' + rxBytes + ' · TX ' + txBytes;
      });
    }

    function receive(bytes) {
      rxBytes += bytes.length;
      // The terminal decodes UTF-8 itself, also when a character is split between two blocks.
      if (encoding.value === 'utf8') term.write(bytes);
      else term.write(latin1.decode(bytes, { stream: true }));
      showCounters();
    }

    // A message from the app or the page, not serial data.
    function notice(message, isError) {
      const colour = isError ? '\x1b[1;31m' : '\x1b[2m';
      term.write((term.buffer.active.cursorX ? '\r\n' : '') + colour + '[' + message + ']\x1b[0m\r\n');
    }

    function terminalText() {
      const buffer = term.buffer.active;
      const lines = [];
      for (let i = 0; i < buffer.length; i++) {
        const row = buffer.getLine(i);
        if (!row) continue;
        const text = row.translateToString(true);
        if (row.isWrapped && lines.length) lines[lines.length - 1] += text;   // a long line shown on several rows
        else lines.push(text);
      }
      while (lines.length && lines[lines.length - 1] === '') lines.pop();
      return lines.join('\n') + '\n';
    }

    btnClear.addEventListener('click', () => { term.reset(); term.focus(); });

    btnSave.addEventListener('click', () => {
      const blob = new Blob([terminalText()], { type: 'text/plain' });
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19);
      a.href = URL.createObjectURL(blob);
      a.download = 'serial-' + (currentPort() || 'console') + '-' + stamp + '.log';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    // ---------------------------------------------------------------- sending

    function connected() {
      return !!link && link.open;
    }

    function encode(text) {
      if (encoding.value === 'utf8') return new TextEncoder().encode(text);
      const out = new Uint8Array(text.length);
      for (let i = 0; i < text.length; i++) {
        const c = text.charCodeAt(i);
        out[i] = c < 256 ? c : 0x3f;                    // not in Latin-1: send "?"
      }
      return out;
    }

    function sendBytes(bytes) {
      if (!connected() || !bytes.length) return;
      link.send(bytes);
      txBytes += bytes.length;
      showCounters();
    }

    function enterBytes() {
      return enterMode.value === 'lf' ? '\n' : enterMode.value === 'crlf' ? '\r\n' : '\r';
    }

    // What local echo shows for the text just sent: printable text as it is,
    // Enter as a new line, Backspace as an erased character; nothing for
    // arrows and the other control sequences.
    function echoOf(data) {
      if (data.charAt(0) === '\x1b') return '';
      let out = '';
      for (const ch of data) {
        const code = ch.codePointAt(0);
        if (ch === '\r') out += '\r\n';
        else if (code === 0x7f || code === 0x08) out += '\b \b';
        else if (code >= 0x20 || code === 0x09) out += ch;
      }
      return out;
    }

    // Keys, paste and on-screen keyboards all arrive here, already translated
    // by the terminal (arrows as escape sequences, Ctrl+C as 0x03, …).
    term.onData((data) => {
      if (!connected()) return;
      if (localEcho.checked) term.write(echoOf(data));
      sendBytes(encode(enterMode.value === 'cr' ? data : data.replace(/\r/g, enterBytes())));
    });

    // Raw bytes (mouse reports from full-screen programs).
    term.onBinary((data) => {
      const out = new Uint8Array(data.length);
      for (let i = 0; i < data.length; i++) out[i] = data.charCodeAt(i) & 0xff;
      sendBytes(out);
    });

    // Copy and paste as in the rest of the browser: Ctrl+C copies when text is
    // selected (otherwise it sends the interrupt), Ctrl+V pastes.
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== 'keydown') return true;
      const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
      if (mod && !e.altKey && key === 'c' && (e.shiftKey || term.hasSelection())) return false;
      if (mod && !e.altKey && key === 'v') return false;
      return true;
    });

    btnSize.addEventListener('click', () => {
      sendBytes(encode('stty cols ' + term.cols + ' rows ' + term.rows + enterBytes()));
      term.focus();
    });

    // ---------------------------------------------------------------- connection

    function setState(kind, text) {
      stateEl.className = 'state ' + kind;
      stateText.textContent = text;
    }

    function setControls(open) {
      for (const el of [portSelect, portCustom, baudSelect, baudCustom, databits, parity, stop, chunk]) el.disabled = open;
      btnPorts.disabled = open;
      btnSize.disabled = !open;
      settingsEl.classList.toggle('open', open);         // small screens keep only the button while connected
      term.options.disableStdin = !open;
      btnConnect.textContent = open ? 'Disconnect' : 'Connect';
      btnConnect.className = open ? 'danger' : 'primary';
      btnConnect.disabled = false;
    }

    // A link carries the console between this page and the app. There are two
    // kinds with the same shape: { open, send(bytes), close() }, reporting to
    // on.open(), on.data(bytes), on.message(text) and on.close(everOpened).

    // The normal one: a WebSocket.
    function wsLink(config, on) {
      const socket = new WebSocket(wsURL);
      socket.binaryType = 'arraybuffer';
      let opened = false;
      const self = {
        open: false,
        send: (bytes) => socket.send(bytes),
        close: () => socket.close()
      };
      const giveUp = setTimeout(() => { if (!opened) socket.close(); }, 8000);
      socket.onopen = () => {
        opened = true;
        self.open = true;
        socket.send(JSON.stringify(config));
        on.open();
      };
      socket.onmessage = (ev) => {
        if (typeof ev.data === 'string') on.message(ev.data);    // text frames are messages from the app
        else on.data(new Uint8Array(ev.data));
      };
      socket.onclose = () => {
        clearTimeout(giveUp);
        self.open = false;
        on.close(opened);
      };
      return self;
    }

    // The other one: plain HTTP requests, for when a WebSocket cannot reach the
    // app (remote access through a service that only carries HTTP). The page
    // keeps asking the app for what was received; the app answers as soon as
    // there is something. What is typed goes in separate requests, one at a
    // time so that the order is kept.
    function httpLink(config, on) {
      let id = '', from = 0, seen = 0, closed = false, failures = 0;
      let queue = [], sending = false;
      const api = (path, extra) => '/api/session' + path + '?t=' + TOKEN + '&s=' + id + (extra || '');
      const pause = (ms) => new Promise((done) => setTimeout(done, ms));

      const self = {
        open: false,
        send(bytes) {
          queue.push(bytes);
          if (!sending) pump();
        },
        close() {
          if (closed) return;
          if (id) fetch(api('/close'), { method: 'POST', keepalive: true }).catch(() => {});
          finish();
        }
      };

      function finish() {
        if (closed) return;
        closed = true;
        const wasOpen = self.open;
        self.open = false;
        on.close(wasOpen);
      }

      async function pump() {
        sending = true;
        while (queue.length && !closed) {
          const total = queue.reduce((n, b) => n + b.length, 0);
          const body = new Uint8Array(total);
          let at = 0;
          for (const b of queue) { body.set(b, at); at += b.length; }
          queue = [];
          let sent = false;
          for (let attempt = 0; attempt < 3 && !sent && !closed; attempt++) {
            try {
              const r = await fetch(api('/tx'), { method: 'POST', body: body, cache: 'no-store' });
              if (r.status === 410) { finish(); break; }
              sent = r.ok;
            } catch (e) { /* tried again below */ }
            if (!sent) await pause(400);
          }
          if (!sent && !closed) on.message('Could not send to the app: ' + total + ' byte' + (total === 1 ? '' : 's') + ' not sent');
        }
        sending = false;
      }

      // One answer is a list of frames: a type byte, the length in 4 bytes, the payload.
      function readFrames(bytes) {
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        let at = 0, ended = false;
        while (at + 5 <= bytes.length) {
          const kind = String.fromCharCode(bytes[at]), length = view.getUint32(at + 1);
          const payload = bytes.subarray(at + 5, at + 5 + length);
          at += 5 + length;
          if (kind === 'D') on.data(payload);
          else if (kind === 'M') on.message(new TextDecoder().decode(payload));
          else if (kind === 'L') on.message('Some received data was lost: it arrived faster than this connection carries it');
          else if (kind === 'E') ended = true;
          else if (kind === 'P') {
            const next = new TextDecoder().decode(payload).split(',');
            from = parseInt(next[0], 10) || 0;
            seen = parseInt(next[1], 10) || 0;
          }
        }
        return ended;
      }

      async function receive() {
        while (!closed) {
          try {
            const r = await fetch(api('/rx', '&from=' + from + '&seen=' + seen), { cache: 'no-store' });
            if (closed) return;
            if (r.status === 410) { finish(); return; }           // the app no longer has this console
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const ended = readFrames(new Uint8Array(await r.arrayBuffer()));
            failures = 0;
            if (ended) { finish(); return; }
          } catch (e) {
            if (closed) return;
            if (++failures >= 6) {
              on.message('Connection to the app lost');
              finish();
              return;
            }
            await pause(500 * failures);
          }
        }
      }

      (async () => {
        try {
          const r = await fetch('/api/session?t=' + TOKEN, {
            method: 'POST', cache: 'no-store',
            headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config)
          });
          const answer = await r.json().catch(() => ({}));
          if (!r.ok || !answer.id) throw new Error(answer.error || 'Could not connect to the app. Reload the page and try again.');
          if (closed) return;
          id = answer.id;
          self.open = true;
          on.open();
          receive();
        } catch (e) {
          if (closed) return;
          on.message(e.message || String(e));
          finish();
        }
      })();

      return self;
    }

    function connect() {
      const port = currentPort(), baud = currentBaud();
      if (!port) { setNote('Choose a port, or type its name.', true); return; }
      if (!baud) { setNote('Enter a valid baud rate.', true); return; }
      setNote('');
      saveSettings();
      term.reset();
      rxBytes = 0; txBytes = 0;
      showCounters();
      latin1 = new TextDecoder('iso-8859-1');

      const config = {
        port: port, baud: baud, databits: parseInt(databits.value, 10), parity: parity.value,
        stop: parseInt(stop.value, 10), chunk: parseInt(chunk.value, 10) || 4096
      };
      const label = port + ' @ ' + baud + ' ' + databits.value + parity.value + stop.value;
      setState('connecting', 'Connecting to ' + port + '…');
      btnConnect.disabled = true;
      start(config, label);
    }

    function start(config, label) {
      const overHTTP = httpOnly;
      let failed = '';
      let mine = null;

      const on = {
        open() {
          setControls(true);
          setState('connected', label + (overHTTP ? ' · HTTP' : ''));
          if (overHTTP) setNote('A WebSocket cannot reach the app from here, so the console uses plain HTTP requests. It works the same, a little slower.');
          term.focus();
        },
        data: receive,
        message(text) {
          failed = text;
          notice(text, true);
        },
        close(everOpened) {
          if (link !== mine) return;
          link = null;
          // The WebSocket never opened and the app said nothing: something on
          // the way does not carry WebSockets. Use HTTP requests from now on.
          if (!overHTTP && !everOpened && !failed) {
            httpOnly = true;
            start(config, label);
            return;
          }
          setControls(false);
          if (failed) {
            setState('error', failed);
          } else if (!everOpened) {
            setState('error', 'Could not connect to the app. Reload the page and try again.');
          } else {
            setState('', 'Disconnected');
            notice('Disconnected');
          }
        }
      };

      mine = (overHTTP ? httpLink : wsLink)(config, on);
      link = mine;
    }

    function disconnect() {
      if (link) link.close();
    }

    // Leaving the page: tell the app now, so that the port is free at once.
    window.addEventListener('pagehide', disconnect);

    btnConnect.addEventListener('click', () => (link ? disconnect() : connect()));

    for (const el of [enterMode, encoding, localEcho]) el.addEventListener('change', saveSettings);

    // ---------------------------------------------------------------- start

    if (saved.databits) databits.value = saved.databits;
    if (saved.parity) parity.value = saved.parity;
    if (saved.stop) stop.value = saved.stop;
    if (saved.chunk) chunk.value = saved.chunk;
    if (saved.enter) enterMode.value = saved.enter;
    if (saved.encoding) encoding.value = saved.encoding;
    localEcho.checked = !!saved.echo;

    fillBauds();
    fillPorts([], saved.port || '');
    refreshPorts();
    notice('Choose a port and a baud rate, then press Connect.');
  </script>
</body>
</html>
